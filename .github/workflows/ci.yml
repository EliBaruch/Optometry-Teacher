name: CI
# Runs only for main and pull requests — not for the work-in-progress
# checkpoint pushes on agent branches (those are expected to be mid-build).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Module boundaries (no monolith)
        run: npm run check:boundaries
      - name: Unit & content tests
        run: npm test
      - name: Build
        run: npx vite build
